# fly.toml app configuration file generated for memba-backend on 2026-02-24T14:11:04+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'memba-backend'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

# Rolling deploy: required because this app has a persistent volume
# ([[mounts]] memba_data) AND runs on a single machine — bluegreen is
# incompatible with both constraints. Accept ~30s of restart downtime
# per deploy; rollback via `flyctl releases rollback` or GHCR image
# mirror (see docs/OPS_RUNBOOK.md §rollback).
[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[env]
  # ⚠️ FIVE of these keys are SHADOWED BY FLY SECRETS and the values below are
  # DOCUMENTATION, not live config: CORS_ORIGINS, GNO_CHAIN_ID,
  # MEMBA_ACCEPTED_CHAIN_IDS, GNO_RPC_URL — and, since the §5 pearl window,
  # NFT_RPC_URL (see its own comment). Ground truth is a SCOPED env read
  # (`fly ssh console -C 'sh -c "printenv | grep -E \"^(GNO_RPC_URL|GNO_CHAIN_ID)=\""'`
  # — never bare printenv); changes to those go through `fly secrets set`
  # (owner-only) AND an edit here so the file stays truthful. Everything else
  # in [env] (NFT_INDEXER_DISABLED, the realm sets, …) is LOAD-BEARING from
  # this file. Values below mirrored from a scoped prod read 2026-09-01.
  CORS_ORIGINS = 'https://memba.samourai.app,http://localhost:5173'
  DB_PATH = '/data/memba.db'
  GNO_CHAIN_ID = 'pearl-1'
  # Token chain-id allowlist (validation). Comma-separated → parseAcceptedChainIDs
  # (service.go) splits it into a set; ValidateToken 401s any token whose chain
  # isn't listed. Topaz cutover PHASE B (2026-07-26) kept 'test-13' here so
  # already-issued test-13 tokens stayed valid until expiry.
  #
  # PHASE C (2026-07-31): dropped — and the failure mode documented here is now
  # FIXED (F-29), so read this list differently than before.
  #
  # It used to govern VALIDATION only. MakeToken took the chain id from the
  # CLIENT and never consulted this list, so a visitor on a chain we do not
  # serve authenticated fine and then 401'd on every call, permanently, with no
  # self-heal (useAuth cleared only on natural expiry; there was no global 401
  # interceptor).
  #
  # Both halves are closed. MakeToken now checks the effective chain id against
  # this list at MINT time and refuses with AUTH-CHAINID-MISMATCH-01, which the
  # UI renders as "switch networks"; and the frontend transport clears the
  # session when the server answers Unauthenticated, so an already-issued bad
  # token no longer strands the app until expiry.
  #
  # ⚠️ THIS VALUE IS A LOCKOUT SWITCH, not merely an allowlist. A chain absent
  # here can no longer log in AT ALL.
  #
  # SAPPHIRE CUTOVER (2026-08-15): flipped STRAIGHT to 'sapphire-1', no
  # dual-accept window — a deliberate departure from the earlier plan recorded
  # here, because by cutover day topaz-1 was already decommissioned (both
  # public RPCs dead) and Adena v1.20.3 had wiped topaz-scoped wallet state, so
  # a lingering topaz session had nothing left it could do. F-29's two fixes
  # make the straight cut clean: a /topaz/ bookmark now gets the mint-time
  # refusal with a "switch networks" UI, and any already-issued topaz token is
  # cleared by the transport interceptor → one clean re-login on sapphire.
  #
  # ⚠️ Never blank this AND GNO_CHAIN_ID to "disable" the check: an empty set
  # means accept EVERY chain (F-29b), so it fails open at exactly the moment you
  # believe you are tightening it. The server now logs a WARN in that state.
  #
  # Watch after deploying: `auth: token chain mismatch` (validation, existing)
  # and `AUTH-CHAINID-MISMATCH-01` (mint-time refusal, new). The new one also
  # increments AuthLoginTotal{result="chain_mismatch"}, so unlike validation
  # rejects it has a metric and can be alerted on.
  #
  # PEARL CUTOVER (2026-08-28→31): dual-accept ON PURPOSE this time — pearl-1
  # was added ahead of the ceremony (owner-approved 08-28) so pearl logins
  # worked from the un-hide, and sapphire-1 STAYS accepted until its 2026-09-09
  # sunset so existing sapphire sessions live out the transition. Post-sunset
  # tightening to 'pearl-1,gnoland1' is an owner secrets change + an edit here.
  MEMBA_ACCEPTED_CHAIN_IDS = 'sapphire-1,pearl-1,gnoland1'
  GNO_RPC_URL = 'https://rpc.pearl.testnets.gno.land:443'
  # NFT indexer — STILL DISABLED after the pearl ceremony, deliberately: the
  # fund-custody NFT realms ARE deployed on pearl-1 now (2026-08-31, recorded
  # in realm-versions.json's `pearl` section), but re-enabling waits for the
  # owner to wire the Prometheus scraper + Alertmanager so the
  # `memba_indexer_*{indexer="nft"}` alerts are live BEFORE the tailer runs.
  # Re-enabling REQUIRES running `fly ssh console -C "/app/memba nft-reset"`
  # first — it wipes nft_indexer_state + the eight event/projection tables in
  # one transaction (NFT_SEED_REALM_CURSOR is INSERT OR IGNORE — it will NOT
  # rewind retained pre-pearl rows, and the projection keys collide across
  # chains like the feed's did) — then setting NFT_START_BLOCK to the pearl
  # deploy height (realm-versions.json `pearl` records; the code default is a
  # test13-era height; never rely on it). Mechanics-of-record:
  # docs/SAPPHIRE_COMMERCE_CEREMONY.md §4 (executed on pearl 2026-08-31).
  NFT_INDEXER_DISABLED = '1'
  # NFT indexer RPC. Dormant as an indexer source while NFT_INDEXER_DISABLED=1,
  # but also the fallback for FEED_RPC_URL/QUEST_RPC_URL-style lookups, so it
  # must point at a LIVE chain. ⚠️ Since the §5 pearl window this key is ALSO
  # set as a Fly SECRET (same value as below) — the secret shadows this file.
  # To restore this file as the single source of truth, the owner can
  # `flyctl secrets unset NFT_RPC_URL -a memba-backend` at a convenient restart
  # (values are identical, so behavior does not change).
  # ⚠️ The #457/#462 throttling class is real on public canonical nodes (403 to
  # the Fly IP under sustained indexer polling; confirmed on topaz 2026-08-10).
  # Low-volume reads are fine. If the NFT indexer is ever re-enabled, give it
  # its own dedicated node rather than this default — the feed already follows
  # that rule (FEED_RPC_URL → our pearl sentry).
  NFT_RPC_URL = 'https://rpc.pearl.samourai.live:443'
  # NFT tailer realm sets — versioned here so prod can never silently fall back
  # to the code defaults (that's exactly how the retired memba_nft_market_v3
  # stayed indexed while v3.1 sales went missing until 2026-07-11). Watched =
  # the v2 pair + both post-ceremony engines (v3.1 winding down, v3.2 active);
  # volume comes from Sale events only on the v3.x engines (v3.2's seeded
  # history emits SaleSeeded, which the dispatcher ignores — no double-count).
  # PRECEDENCE (2026-07-11): both keys also exist as Fly SECRETS set by the
  # owner, and secrets override [env]. Once this lands, drop them so this file
  # is the single source of truth:
  #   flyctl secrets unset NFT_WATCHED_REALMS NFT_SALE_VOLUME_REALMS -a memba-backend
  NFT_WATCHED_REALMS = 'gno.land/r/samcrew/memba_nft_market_v2,gno.land/r/samcrew/memba_nft_v2,gno.land/r/samcrew/memba_nft_market_v3_1,gno.land/r/samcrew/memba_nft_market_v3_2,gno.land/r/samcrew/memba_collections'
  NFT_SALE_VOLUME_REALMS = 'gno.land/r/samcrew/memba_nft_market_v3_1,gno.land/r/samcrew/memba_nft_market_v3_2'
  # AUTH ENFORCEMENT — fail-closed by default since Wave 1 (2026-06-28).
  # MEMBA_ALLOW_UNSIGNED_AUTH no longer needed (default rejects unsigned auth).
  # Set to '1' ONLY in dev/staging if you need unsigned auth for testing.
  # A3 multisig sig-verify enforcement is HELD: no multisig_sig_verify{result=ok}
  # has been observed, so flipping it blind could reject a legit multisig tx if A3
  # sign-byte reconstruction diverges (as the login doc did). Validate A3 against a
  # real member signature first, THEN add:
  #   MEMBA_ENFORCE_MULTISIG_SIG_VERIFY = '1'
  PORT = '8080'

[[mounts]]
  source = 'memba_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
