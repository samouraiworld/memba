# fly.toml app configuration file generated for memba-backend on 2026-02-24T14:11:04+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'memba-backend'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

# Rolling deploy: required because this app has a persistent volume
# ([[mounts]] memba_data) AND runs on a single machine — bluegreen is
# incompatible with both constraints. Accept ~30s of restart downtime
# per deploy; rollback via `flyctl releases rollback` or GHCR image
# mirror (see docs/OPS_RUNBOOK.md §rollback).
[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[env]
  CORS_ORIGINS = 'https://memba.samourai.app,http://localhost:5173'
  DB_PATH = '/data/memba.db'
  GNO_CHAIN_ID = 'topaz-1'
  # Token chain-id allowlist (validation). Comma-separated → parseAcceptedChainIDs
  # (service.go) splits it into a set; ValidateToken 401s any token whose chain
  # isn't listed. Topaz cutover PHASE B (2026-07-26) kept 'test-13' here so
  # already-issued test-13 tokens stayed valid until expiry.
  #
  # PHASE C (2026-07-31): dropped. Note what this does and does NOT mean.
  # test-13 tokens are STILL MINTABLE today: test13 is hidden in NETWORKS but
  # deliberately still resolvable (deep links + stored `memba_network`), and
  # MakeToken takes the chain id from the CLIENT (auth/crypto.go ~302,
  # `effectiveChainID := info.ChainId`) — it never consults this list. So a
  # returning pre-cutover visitor still on /test13/ authenticates fine and then
  # 401s on every call ("token issued for a different chain", crypto.go ~507)
  # until they switch to Topaz. It does NOT self-heal: useAuth only clears a
  # token on natural expiry, and there is no global 401 interceptor.
  #
  # Accepted because test13's chain is dead (RPCs refuse connections),
  # ChainHaltedBanner fires globally for it and its "switch to Topaz" works, and
  # the identical failure ALREADY ships for gnoland1 — which is not hidden and
  # whose tokens this list has been rejecting all along. This widens that set
  # from {gnoland1} to {gnoland1, test-13}; it does not create the failure mode.
  # The real fix is to validate the chain id at MINT time — see the follow-up.
  #
  # Watch after deploying: `auth: token chain mismatch` with
  # token_chain_id=test-13. There is no metric for validation rejects
  # (AuthLoginTotal counts mint attempts only), so logs are the only signal.
  MEMBA_ACCEPTED_CHAIN_IDS = 'topaz-1'
  GNO_RPC_URL = 'https://rpc.topaz.testnets.gno.land:443'
  # NFT indexer — DISABLED for the topaz cutover (2026-07-26): the NFT realms
  # are not yet deployed on topaz (commerce ceremony pending), and the tailer's
  # chain-agnostic nft_indexer_state cursor must not advance against the wrong
  # chain. Re-enable at the ceremony: drop this flag, seed cursors via
  # NFT_SEED_REALM_CURSOR, and set NFT_START_BLOCK to the topaz deploy height.
  NFT_INDEXER_DISABLED = '1'
  # NFT indexer RPC — pinned to samourai's own node (the public node
  # rate-limited the Fly egress IP during fast catch-up, #457/#462; our own
  # node doesn't throttle us). Dormant while NFT_INDEXER_DISABLED=1, but also
  # the fallback for FEED_RPC_URL/QUEST_RPC_URL-style lookups, so it must
  # point at a LIVE chain.
  NFT_RPC_URL = 'https://rpc.topaz.testnets.gno.land:443'
  # NFT tailer realm sets — versioned here so prod can never silently fall back
  # to the code defaults (that's exactly how the retired memba_nft_market_v3
  # stayed indexed while v3.1 sales went missing until 2026-07-11). Watched =
  # the v2 pair + both post-ceremony engines (v3.1 winding down, v3.2 active);
  # volume comes from Sale events only on the v3.x engines (v3.2's seeded
  # history emits SaleSeeded, which the dispatcher ignores — no double-count).
  # PRECEDENCE (2026-07-11): both keys also exist as Fly SECRETS set by the
  # owner, and secrets override [env]. Once this lands, drop them so this file
  # is the single source of truth:
  #   flyctl secrets unset NFT_WATCHED_REALMS NFT_SALE_VOLUME_REALMS -a memba-backend
  NFT_WATCHED_REALMS = 'gno.land/r/samcrew/memba_nft_market_v2,gno.land/r/samcrew/memba_nft_v2,gno.land/r/samcrew/memba_nft_market_v3_1,gno.land/r/samcrew/memba_nft_market_v3_2,gno.land/r/samcrew/memba_collections'
  NFT_SALE_VOLUME_REALMS = 'gno.land/r/samcrew/memba_nft_market_v3_1,gno.land/r/samcrew/memba_nft_market_v3_2'
  # AUTH ENFORCEMENT — fail-closed by default since Wave 1 (2026-06-28).
  # MEMBA_ALLOW_UNSIGNED_AUTH no longer needed (default rejects unsigned auth).
  # Set to '1' ONLY in dev/staging if you need unsigned auth for testing.
  # A3 multisig sig-verify enforcement is HELD: no multisig_sig_verify{result=ok}
  # has been observed, so flipping it blind could reject a legit multisig tx if A3
  # sign-byte reconstruction diverges (as the login doc did). Validate A3 against a
  # real member signature first, THEN add:
  #   MEMBA_ENFORCE_MULTISIG_SIG_VERIFY = '1'
  PORT = '8080'

[[mounts]]
  source = 'memba_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
