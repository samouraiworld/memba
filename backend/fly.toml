# fly.toml app configuration file generated for memba-backend on 2026-02-24T14:11:04+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'memba-backend'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

# Rolling deploy: required because this app has a persistent volume
# ([[mounts]] memba_data) AND runs on a single machine — bluegreen is
# incompatible with both constraints. Accept ~30s of restart downtime
# per deploy; rollback via `flyctl releases rollback` or GHCR image
# mirror (see docs/OPS_RUNBOOK.md §rollback).
[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[env]
  # ⚠️ FIVE of these keys are SHADOWED BY FLY SECRETS and the values below are
  # DOCUMENTATION, not live config: CORS_ORIGINS, GNO_CHAIN_ID,
  # MEMBA_ACCEPTED_CHAIN_IDS, GNO_RPC_URL — and, since the §5 pearl window,
  # NFT_RPC_URL (see its own comment). Ground truth is a SCOPED env read
  # (`fly ssh console -C 'sh -c "printenv | grep -E \"^(GNO_RPC_URL|GNO_CHAIN_ID)=\""'`
  # — never bare printenv); changes to those go through `fly secrets set`
  # (owner-only) AND an edit here so the file stays truthful. Everything else
  # in [env] (NFT_INDEXER_DISABLED, the realm sets, …) is LOAD-BEARING from
  # this file. Values below mirrored from a scoped prod read 2026-09-01, then
  # moved to the gno.land mainnet (gnoland-1) truth at the 2026-09-23 cutover —
  # the secrets must be set to match at deploy time.
  # CORS_ORIGINS mirrored from what the live backend answers to a preflight (2026-10-06).
  CORS_ORIGINS = 'https://memba.club,https://www.memba.club,https://memba.samourai.app,https://*--memba-multisig.netlify.app,http://localhost:5173'
  DB_PATH = '/data/memba.db'
  GNO_CHAIN_ID = 'gnoland-1'
  # Token chain-id allowlist. Comma-separated → parseAcceptedChainIDs
  # (service.go). ValidateToken 401s any token whose chain isn't listed, and
  # MakeToken refuses to mint for one (AUTH-CHAINID-MISMATCH-01, rendered as
  # "switch networks"); the frontend transport clears a session the server
  # answers Unauthenticated, so a token from a dropped chain costs one clean
  # re-login.
  #
  # ⚠️ THIS VALUE IS A LOCKOUT SWITCH, not merely an allowlist: a chain absent
  # here cannot log in at all. Keep it in step with the owner's
  # `fly secrets set`. Chain cuts so far were straight cuts (the old chain was
  # already dead); a dual-accept window is only needed while both chains live.
  #
  # ⚠️ Never blank this AND GNO_CHAIN_ID to "disable" the check: an empty set
  # means accept EVERY chain (F-29b), so it fails open at exactly the moment you
  # believe you are tightening it. The server logs a WARN in that state.
  #
  # Watch after changing it: `auth: token chain mismatch` (validation) and
  # `AUTH-CHAINID-MISMATCH-01` (mint-time refusal, also counted in
  # AuthLoginTotal{result="chain_mismatch"}, so it can be alerted on).
  MEMBA_ACCEPTED_CHAIN_IDS = 'gnoland-1'
  # Generic low-volume reads → the public mainnet canonical. The feed tailer
  # polls a DIFFERENT node (FEED_RPC_URL → rpc.mainnet.samourai.live).
  GNO_RPC_URL = 'https://rpc.gno.land:443'
  # Native multisig receipt checks. The primary is ONE node (ours): only it,
  # checked as the chain with a block from the last 10 s, may answer that a
  # transaction is absent, which lets a member broadcast. The fallback is the
  # public load-balanced pool, where each request can reach another node: it
  # is asked only when the primary cannot answer, and may only confirm a
  # receipt. A secret of the same name wins over these lines.
  MEMBA_NATIVE_GNO_RPC_URL = 'https://rpc.mainnet.samourai.live'
  MEMBA_NATIVE_GNO_RPC_FALLBACK_URL = 'https://rpc.gno.land:443'
  # NFT indexer — DISABLED. No NFT market is deployed on gno.land mainnet
  # (realm-versions.json `mainnet`, 2026-09-23); the pearl-era notes below
  # apply once one ships. Re-enabling also waits for the owner to wire the Prometheus scraper + Alertmanager so the
  # `memba_indexer_*{indexer="nft"}` alerts are live BEFORE the tailer runs.
  # Re-enabling REQUIRES running `fly ssh console -C "/app/memba nft-reset"`
  # first — it wipes nft_indexer_state + the eight event/projection tables in
  # one transaction (NFT_SEED_REALM_CURSOR is INSERT OR IGNORE — it will NOT
  # rewind retained pre-pearl rows, and the projection keys collide across
  # chains like the feed's did) — then setting NFT_START_BLOCK to the market
  # realm's mainnet deploy height (realm-versions.json `mainnet`; the code
  # default is a test13-era height; never rely on it). Mechanics-of-record:
  # docs/archive/SAPPHIRE_COMMERCE_CEREMONY.md §4 (executed on pearl 2026-08-31).
  NFT_INDEXER_DISABLED = '1'
  # NFT indexer RPC. Dormant as an indexer source while NFT_INDEXER_DISABLED=1,
  # but also the fallback for FEED_RPC_URL/QUEST_RPC_URL-style lookups, so it
  # must point at a LIVE chain. This key is NOT a Fly secret (verified
  # 2026-09-06 via `fly secrets list`) — the value below is authoritative.
  # ⚠️ The #457/#462 throttling class is real on public canonical nodes (403 to
  # the Fly IP under sustained indexer polling; confirmed on topaz 2026-08-10).
  # Low-volume reads are fine. If the NFT indexer is ever re-enabled, give it
  # its own dedicated node rather than this default — the feed already follows
  # that rule (FEED_RPC_URL → our mainnet node). Mainnet cutover (2026-09-23):
  # the Samourai-operated gnoland-1 node, matching the code default.
  NFT_RPC_URL = 'https://rpc.mainnet.samourai.live'
  # NFT tailer realm sets — versioned here so prod can never silently fall back
  # to the code defaults (that's exactly how the retired memba_nft_market_v3
  # stayed indexed while v3.1 sales went missing until 2026-07-11). Watched =
  # the two NFT artifacts of the 2026-08-31 pearl ceremony only
  # (realm-versions.json `pearl`: memba_collections seq 28 @100489,
  # memba_nft_market_v3_2 seq 32 @100497). memba_nft_market_v2 / memba_nft_v2 /
  # memba_nft_market_v3_1 were NEVER deployed on pearl — listing them only
  # burns RPC calls and would seed cursors for absent realms. Volume comes
  # from Sale events on the v3.2 engine (its seeded history emits SaleSeeded,
  # which the dispatcher ignores — no double-count).
  # Neither key is a Fly secret (verified 2026-09-06 via `fly secrets list`) —
  # these values are authoritative. They are pearl-era and name realms NOT
  # deployed on mainnet; inert while NFT_INDEXER_DISABLED=1 — replace them
  # with the mainnet market realms before any re-enable.
  NFT_WATCHED_REALMS = 'gno.land/r/samcrew/memba_nft_market_v3_2,gno.land/r/samcrew/memba_collections'
  NFT_SALE_VOLUME_REALMS = 'gno.land/r/samcrew/memba_nft_market_v3_2'
  # AUTH ENFORCEMENT — fail-closed by default since Wave 1 (2026-06-28).
  # MEMBA_ALLOW_UNSIGNED_AUTH no longer needed (default rejects unsigned auth).
  # Set to '1' ONLY in dev/staging if you need unsigned auth for testing.
  # A3 multisig sig-verify enforcement is HELD: no multisig_sig_verify{result=ok}
  # has been observed, so flipping it blind could reject a legit multisig tx if A3
  # sign-byte reconstruction diverges (as the login doc did). Validate A3 against a
  # real member signature first, THEN add:
  #   MEMBA_ENFORCE_MULTISIG_SIG_VERIFY = '1'
  # AI analyst: OFF unless ANALYST_ENABLED = 'true' (the endpoint answers 503).
  # Not set here on purpose. When enabling, also consider ANALYST_ADMIN_BEARER
  # (Fly secret, operator-only forced refresh) and ANALYST_DAILY_CAP_PER_WALLET
  # (default 5 per UTC day; 0 = wallets cannot generate). See docs/OPS_RUNBOOK.md.
  PORT = '8080'

[[mounts]]
  source = 'memba_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
