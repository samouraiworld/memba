[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# The consolidated design is reviewable in PR previews; production activation remains explicit.
[context.deploy-preview.environment]
  VITE_ENABLE_PRO_APP = "true"

# Retiring the classic site (ALP-4). These rules match its hosts only, so the
# memba.club site, which deploys this same file, never redirects to itself.
# They come first and every one is forced: without force, Netlify serves the
# real files (/sw.js, /, the static blog pages) and nothing below would fire.
#   - /sw.js serves the kill switch, which unregisters a returning visitor's
#     old service worker (that worker would otherwise answer from its cache);
#   - the sitemap pages go straight to their Memba OS window (each target is
#     what the app's own classic-to-OS table gives; frontend/src/lib/retiredSite
#     .test.ts checks them against it);
#   - everything else goes to the same path on memba.club, query kept, where
#     the app opens its window or keeps the page.
# 302 while the move is checked; 301 later (ALP-5).

# Canary: the Netlify host of the classic site.
[[redirects]]
  from = "https://memba-multisig.netlify.app/sw.js"
  to = "/sw-retire.js"
  status = 200
  force = true

