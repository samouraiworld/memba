[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# The consolidated design is reviewable in PR previews; production activation remains explicit.
[context.deploy-preview.environment]
  VITE_ENABLE_PRO_APP = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# D1 (AAA-0): Immutable cache for content-hashed Vite assets.
# Filenames like /assets/index-racrH-hq.js are content-hashed — safe to cache
# permanently. index.html stays at must-revalidate (always checks for new builds).
# Without this, all assets serve max-age=0,must-revalidate (Netlify default) and
# every mobile revisit revalidates every chunk over a flaky 4G connection.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "22"
  # Pin the network key so the Netlify build can't pick up a stale dashboard
  # VITE_GNO_CHAIN_ID. A retired "test12" there made DEFAULT_NETWORK invalid and
  # infinite-looped the /:network redirects (/test12/test12/… → replaceState crash,
  # hit on mobile / private browsing). lib/config.ts also validates this against
  # NETWORKS as a code-level safety net.
  # ⚠️ Chain cutover rule (learned across the test13→topaz and topaz→sapphire
  # moves): merging a change to this value flips the PROD landing network. A
  # full chain CUT is a COORDINATED change — the backend Fly secrets
  # (MEMBA_ACCEPTED_CHAIN_IDS, GNO_CHAIN_ID, the RPC URLs, FEED_START_BLOCK)
  # and the MANDATORY feed-state reset (the DB cursor beats the env floor)
  # MUST land in the same window, or auth/feed/home break. See
  # docs/OPS_RUNBOOK.md.
  #
  # AUTH-CHAINID-MISMATCH-01: a landing network whose chain id is missing
  # from the backend's MEMBA_ACCEPTED_CHAIN_IDS (a Fly SECRET that shadows
  # fly.toml) fails sign-in closed for every visitor, so the two move
  # together. Never blank that key to "disable" the check: an empty set
  # accepts EVERY chain (F-29b fails open).
  VITE_GNO_CHAIN_ID = "mainnet"

# CSP Dual-Config (v2.9):
# This is the PRODUCTION CSP enforced by Netlify edge headers.
# The LOCAL/DEV CSP is in frontend/index.html <meta http-equiv="Content-Security-Policy">.
# ⚠️ KEEP connect-src / frame-src / style-src IN SYNC across BOTH files.
# script-src INTENTIONALLY DIVERGES (SEC-3): prod drops 'unsafe-inline' and instead
# allowlists the one inline script — the Plausible init stub in index.html — by its
# sha256 hash. Dev keeps 'unsafe-inline' because Vite's HMR injects unhashed inline
# scripts. If you edit that stub, recompute the hash: it is the sha256 of the exact
# <script> body. (A hash + 'unsafe-inline' together makes browsers ignore the latter.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self \"https://meet.jit.si\" \"https://8x8.vc\" \"https://visio.samourai.app\"), microphone=(self \"https://meet.jit.si\" \"https://8x8.vc\" \"https://visio.samourai.app\"), display-capture=(self \"https://visio.samourai.app\"), autoplay=(self \"https://visio.samourai.app\"), clipboard-write=(self \"https://visio.samourai.app\"), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-RKeIJQLtLAaYxbFsLBpXRInYOcrjaV91lSaqbZVEX5E=' 'wasm-unsafe-eval' https://clerk.memba.club https://clerk.samourai.app https://challenges.cloudflare.com https://plausible.io blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://memba-backend.fly.dev https://*.gno.land https://*.testnets.gno.land https://*.samourai.live https://*.sentry.io https://api.github.com https://gateway.lighthouse.storage wss://*.gno.land https://clerk.memba.club https://accounts.memba.club https://clerk.samourai.app https://accounts.samourai.app https://sepolia.base.org https://mainnet.base.org https://base-sepolia.g.alchemy.com https://base-mainnet.g.alchemy.com https://plausible.io; img-src 'self' data: https: ipfs:; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-src https://meet.jit.si https://8x8.vc https://challenges.cloudflare.com https://accounts.memba.club https://accounts.samourai.app https://www.youtube-nocookie.com https://visio.samourai.app;"
