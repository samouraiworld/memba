name: Professional preview

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/professional-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-preview-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Only what this job alone proves: the flag-on preview suites in four browsers,
  # each against its own dev server with the flags set. Lint, the unit suite and
  # the default production build run in the required Frontend (React · Node 20/22)
  # jobs; repeating them here took 8 to 11 of this job's minutes and ran it into
  # its limit. The suites and the install measured 4 to 8 minutes (2026-10-06/07).
  preview:
    name: Professional preview (four browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # One browser download took 10.8 minutes (2026-10-06): keep them between runs,
      # keyed on the lockfile that pins Playwright.
      - name: Cache preview browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install preview browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Flag-on preview tests
        run: npm run test:e2e:pro-ui
      - name: Flag-on shell and brand tests
        run: npm run test:e2e:pro-shell
      - name: Flag-on governance tests
        run: npm run test:e2e:pro-governance
      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validators-preview-evidence
          path: |
            frontend/test-results/
            frontend/test-results-shell/
            frontend/test-results-governance/
          retention-days: 14

  complete:
    name: Complete design (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [complete, complete-features]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Complete interface and accessibility matrix
        run: npm run test:e2e:${{ matrix.suite }}
      - name: Full-design build
        if: matrix.suite == 'complete'
        run: npm run build
        env:
          VITE_ENABLE_PRO_APP: 'true'
      - name: Upload route review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-${{ matrix.suite }}
          path: frontend/test-results-${{ matrix.suite }}/
          retention-days: 14
