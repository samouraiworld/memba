name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  frontend-audit:
    name: Frontend — npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: npm audit (production)
        run: cd frontend && npm run audit:ci

  workspaces-audit:
    # The pnpm half of the same gate that ci.yml runs per-PR. This cron leg is
    # not redundant with it — it is the leg that would actually have caught the
    # incident. Of the 8 advisories found sitting in pnpm-lock.yaml, 7 were
    # PUBLISHED AFTER the commit that last touched it: the lockfile never
    # changed, so no PR ever ran, and a purely PR-triggered gate would have
    # stayed green the whole time. Advisories land against a static tree; only
    # a scheduled audit sees them.
    name: pnpm workspaces — pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: pnpm audit (high/critical, fail-closed)
        run: node scripts/pnpm-audit-ci.mjs

  # backend-audit removed (v7.1 plan §4.2 a.2): govulncheck is run by
  # ci.yml on every PR and govulncheck.yml on cron. Running here on a third
  # schedule (with a stale Go pin) produced inconsistent signal.

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Install @cyclonedx/cyclonedx-npm
        run: npm install -g @cyclonedx/cyclonedx-npm
      - name: Generate SBOM
        run: cd frontend && cyclonedx-npm --output-file ../sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
