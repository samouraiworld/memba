name: Gno Contracts

# W1.2 — the AUTHORITATIVE client-template compile gate.
#
# History: this job used to run `gno test`/`gno lint` over HAND-WRITTEN stubs
# emitted by scripts/extract-contracts.ts (never the real generators) with an
# unpinned `gno@latest` — green while validating nothing. It now runs the real
# compile gate (frontend/src/lib/templates.compile.test.ts): every template
# generator's REAL output, linted as ONE gno workspace (cross-realm imports
# resolved), with a toolchain probe + negative control, and REQUIRE_GNO=1 so
# a missing/incoherent toolchain is a FAILURE, never a silent skip.

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/lib/*Template.ts'
      - 'frontend/src/lib/templates/**'
      - 'frontend/src/lib/templates.compile.test.ts'
      - 'frontend/src/lib/daoTemplate.governance.gno.test.ts'
      - 'frontend/src/lib/daoTemplate.reads.gno.test.ts'
      - 'frontend/src/lib/channelTemplate.membership.gno.test.ts'
      - 'frontend/src/lib/escrowTemplate.refunds.gno.test.ts'
      # Shared toolchain probe every spec above gates on — a change here can turn the
      # whole gate green-but-blind, so it must trigger the job too.
      - 'frontend/src/test/gnoToolchain.ts'
      - 'frontend/src/test/gnoToolchain.test.ts'
      # Not a template, but its values are interpolated INTO emitted realm source
      # (candidatureTemplate reads MEMBA_DAO.realmPath / MEMBA_TOKEN.symbol;
      # daoTemplate gates which members are emitted on BECH32_PREFIX). Editing it
      # changes generated on-chain code, so it must not bypass the compile gate.
      - 'frontend/src/lib/config.ts'
      - '.github/workflows/gno-test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/lib/*Template.ts'
      - 'frontend/src/lib/templates/**'
      - 'frontend/src/lib/templates.compile.test.ts'
      - 'frontend/src/lib/daoTemplate.governance.gno.test.ts'
      - 'frontend/src/lib/daoTemplate.reads.gno.test.ts'
      - 'frontend/src/lib/channelTemplate.membership.gno.test.ts'
      - 'frontend/src/lib/escrowTemplate.refunds.gno.test.ts'
      # Shared toolchain probe every spec above gates on — a change here can turn the
      # whole gate green-but-blind, so it must trigger the job too.
      - 'frontend/src/test/gnoToolchain.ts'
      - 'frontend/src/test/gnoToolchain.test.ts'
      # Not a template, but its values are interpolated INTO emitted realm source
      # (candidatureTemplate reads MEMBA_DAO.realmPath / MEMBA_TOKEN.symbol;
      # daoTemplate gates which members are emitted on BECH32_PREFIX). Editing it
      # changes generated on-chain code, so it must not bypass the compile gate.
      - 'frontend/src/lib/config.ts'
      - '.github/workflows/gno-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned gno toolchain (master SHA). Releases through v1.1.0 predate the
  # interrealm-v2 stdlib layout (`chain/runtime/unsafe`) and CANNOT type-check
  # the templates — the pin must be a commit that has it. The go-installed
  # binary resolves GNOROOT to its own module cache, which ships the full
  # stdlibs + examples, so no GNOROOT env or repo checkout is needed.
  # Verified locally against this exact SHA (probe + 6 templates + negative
  # control).
  #
  # 🔴 BUMPING THIS IS NOT A CHORE — READ FIRST. The probe runs in BOTH
  # directions: it fails the job if the pinned gno is too OLD to lint
  # interrealm-v2, and equally if the stdlib it resolves no longer provides what
  # the templates target.
  #
  # THE PIN MUST TRACK THE CHAIN WE DEPLOY TO. A pin no live chain runs makes
  # this gate green against an ABI that does not exist on-chain — which is
  # exactly how the two breaks below stayed hidden. Bumped 7b2888c3 (2026-07-02)
  # → 1c6ac026, the sapphire RC, because #1057 retired the topaz node the app
  # used to point at. (The intermediate topaz RC 697011c4 also passes; sapphire
  # is chosen so the toolchain matches the chain the frontend targets.)
  #
  # Two BREAKING toolchain changes the old pin hid, both now satisfied:
  #   1. `avl.Tree.Get` returns a SINGLE value (was `(any, bool)`) —
  #      gnolang/gno#5314. Presence checks moved to `Has`, value reads to a
  #      comma-ok type assertion. VERIFIED ON-CHAIN 2026-08-11: `vm/qfile
  #      gno.land/p/nt/avl/v0/tree.gno` returns `Get(key string) any` and
  #      `Has(key string) bool` on BOTH topaz-1 and sapphire-1, so the migrated
  #      form is correct for either target and only this pin differs.
  #   2. gnovm enforces package name == last path element
  #      (ValidatePkgNameMatchesPath, gnolang/gno#5048) — candidatureTemplate
  #      hardcoded `package candidature`, which cannot deploy at its real path
  #      `.../memba_dao_candidature_v3`; it now derives the name from the realm
  #      path like every other generator.
  # Both are the same failure class: generated code that only type-checks
  # against a stale pin. Re-run the gate locally before the next bump.
  #
  # This value is parsed by frontend/src/test/gnoToolchain.ts (`declaredGnoPin`)
  # so the drift message can quote the real SHA. Keep it a plain hex literal.
  GNO_PIN: c4c72fdd288c757e8da0d93aae867fa479b1b15c

jobs:
  gno-test:
    name: Gno Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Cache gno toolchain build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gno-toolchain-${{ runner.os }}-${{ env.GNO_PIN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install gno toolchain (pinned)
        run: go install "github.com/gnolang/gno/gnovm/cmd/gno@${GNO_PIN}"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Compile gate — real generator output, one workspace, fail-closed
        working-directory: frontend
        # `src/test/gnoToolchain.test.ts` runs here too so the shared probe's MECHANISM
        # is proven against the pinned toolchain — its negative control asserts the probe
        # still rejects code that cannot type-check, i.e. that it has not rotted into
        # always-green. Every other spec in this list gates on that probe's verdict.
        run: REQUIRE_GNO=1 npx vitest run src/test/gnoToolchain.test.ts src/lib/templates.compile.test.ts src/lib/daoTemplate.governance.gno.test.ts src/lib/daoTemplate.reads.gno.test.ts src/lib/channelTemplate.membership.gno.test.ts src/lib/escrowTemplate.refunds.gno.test.ts
