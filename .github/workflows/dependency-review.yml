name: Dependency Review

# Blocks PRs that introduce dependencies with known vulnerabilities.
# Free, runs on every PR, complements the heavier npm-audit + govulncheck
# already in ci.yml. See docs/DEPENDENCY_POLICY.md §11.

on:
  pull_request:
    branches: [main, dev/v2]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Acknowledged advisories — kept in sync with the ALLOWLIST in
          # frontend/scripts/audit-ci.mjs, which carries the full written
          # justification for each entry. The sync is ENFORCED by a test
          # (frontend/scripts/audit-ci.test.ts), not by this comment.
          #
          # Why it matters that these two agree: `Dependency Review` only
          # evaluates dependencies a PR CHANGES, so bumping react-router by a
          # single patch made this job red over an advisory we had already
          # formally acknowledged and that the PR was not fixing — a false red
          # on unrelated work.
          #
          # GHSA-qwww-vcr4-c8h2 (react-router / react-router-dom): RSC-mode CSRF.
          # Memba is a Vite SPA on <BrowserRouter> + <Routes> and does not use
          # React Router's RSC/data-server APIs, so the path is unreachable.
          #
          # NOTE: audit-ci.mjs records the re-evaluation trigger as "when
          # react-router ships a fixed >8.2.0". 8.3.0 now exists, so that trigger
          # HAS fired and the allowlist is pending an owner decision (the fix is a
          # v8 major). This entry mirrors the existing decision; it does not make a
          # new one. Do NOT resolve it by downgrading to 7.11.x — that range
          # carries GHSA-49rj (unauthenticated RCE, <=7.14.1) and GHSA-h5cw
          # (CSRF, <=7.11.0); the pinned 7.18.1 is safe from both.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          # Allow common permissive licenses. Reject everything else (unknown
          # OSS license = manual review). Add new licenses here only after a
          # case-by-case sign-off.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD, Unlicense, CC0-1.0, LicenseRef-bad-see-license-in-license.md
          comment-summary-in-pr: on-failure
