version: v2
plugins:
  # Go protobuf
  - remote: buf.build/protocolbuffers/go
    out: backend/gen
    opt:
      - paths=source_relative
  # Go ConnectRPC
  - remote: buf.build/connectrpc/go
    out: backend/gen
    opt:
      - paths=source_relative
  # TypeScript protobuf messages and service descriptors (the client is built from these)
  - remote: buf.build/bufbuild/es
    out: frontend/src/gen
    opt:
      - target=ts
