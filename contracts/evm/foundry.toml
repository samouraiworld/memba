[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Fork tests build long Safe and Snapshot X calldata; the legacy pipeline runs out of stack.
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# The manifest tests read deployments/evm.
fs_permissions = [{ access = "read", path = "../../deployments/evm" }]

# Public defaults. CI and local runs override them with BASE_RPC_URL / BASE_SEPOLIA_RPC_URL (test/RpcUrl.sol).
[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"

[fmt]
line_length = 120

# Wizard output must stay byte-identical to the generator.
ignore = ["src/MembaToken.sol"]
